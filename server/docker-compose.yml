services:
  postgres:
    image: postgres:16-alpine
    container_name: sts-sofitrans-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sts
      POSTGRES_PASSWORD: sts
      POSTGRES_DB: sts_sofitrans
    ports:
      - "5432:5432"
    volumes:
      - sts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sts -d sts_sofitrans"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sts_pgdata:
