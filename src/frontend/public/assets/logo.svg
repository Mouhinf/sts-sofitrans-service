<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="STS SOFITRANS SERVICE">
  <title>STS SOFITRANS SERVICE</title>
  <desc>Logo officiel — Burkina green, authority black, globe blue</desc>

  <defs>
    <!-- Palette aligned with DESIGN.md oklch tokens -->
    <style>
      .ink { fill: #1c1c1c; }         /* foreground oklch(0.12 0 0) */
      .growth { fill: #2f7a3e; }      /* primary   oklch(0.4 0.12 136) */
      .globe { fill: #2563a8; }       /* secondary oklch(0.42 0.15 249) */
      .paper { fill: #f5f3ec; }       /* off-white warm surface */
      .stroke { stroke: #1c1c1c; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- =================== MARK =================== -->
  <g transform="translate(10, 10)">
    <!-- Circular shield background -->
    <circle cx="100" cy="100" r="98" fill="#ffffff"/>
    <circle cx="100" cy="100" r="98" class="stroke"/>
    <circle cx="100" cy="100" r="92" class="stroke" stroke-opacity="0.25"/>

    <!-- Tricolor vertical bars -->
    <rect x="50"  y="38" width="34" height="124" class="growth"/>
    <rect x="84"  y="38" width="34" height="124" class="ink"/>
    <rect x="118" y="38" width="34" height="124" class="globe"/>

    <!-- Globe overlay (white meridians + equator) -->
    <g class="stroke" stroke="#ffffff">
      <ellipse cx="100" cy="100" rx="64" ry="64"/>
      <ellipse cx="100" cy="100" rx="42" ry="64" fill="none"/>
      <line x1="36"  y1="100" x2="164" y2="100"/>
      <line x1="100" y1="36"  x2="100" y2="164"/>
      <path d="M 36 100 Q 100 70 164 100" fill="none" stroke="#ffffff" stroke-width="1.25"/>
      <path d="M 36 100 Q 100 130 164 100" fill="none" stroke="#ffffff" stroke-width="1.25"/>
    </g>

    <!-- Bottom anchor stripe -->
    <rect x="50" y="170" width="102" height="6" class="ink"/>

    <!-- Monogram STS (subtle, in the central black bar) -->
    <text
      x="100" y="116"
      text-anchor="middle"
      font-family="'Fraunces', Georgia, serif"
      font-size="38"
      font-weight="700"
      letter-spacing="1"
      fill="#ffffff"
      opacity="0.92"
    >STS</text>
  </g>

  <!-- =================== WORDMARK =================== -->
  <g transform="translate(240, 0)">
    <!-- Soft warm background for legibility -->
    <rect x="0" y="0" width="480" height="220" fill="#ffffff"/>

    <!-- Primary line -->
    <text
      x="0" y="92"
      font-family="'Fraunces', Georgia, serif"
      font-size="62"
      font-weight="700"
      letter-spacing="2"
      class="ink"
    >SOFITRANS</text>

    <!-- Secondary line -->
    <text
      x="0" y="142"
      font-family="'Fraunces', Georgia, serif"
      font-size="36"
      font-weight="400"
      letter-spacing="6"
      class="globe"
    >SERVICE</text>

    <!-- Tricolor rule -->
    <line x1="0" y1="160" x2="60"  y2="160" stroke="#2f7a3e" stroke-width="3"/>
    <line x1="64" y1="160" x2="124" y2="160" stroke="#1c1c1c" stroke-width="3"/>
    <line x1="128" y1="160" x2="188" y2="160" stroke="#2563a8" stroke-width="3"/>

    <!-- Tagline -->
    <text
      x="0" y="190"
      font-family="'Fraunces', Georgia, serif"
      font-size="16"
      font-style="italic"
      letter-spacing="0.5"
      fill="#5b5b5b"
    >Pour Mieux Vous Servir.</text>
  </g>
</svg>
